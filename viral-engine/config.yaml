  # ==========================================================================
  # מקורות טרנדים ואקטואליה — נסרקים בכל ריצה כדי לתפוס "מה חם עכשיו".
  # type: trend = מה מתפוצץ הרגע; actuality = חדשות AI שוטפות.
  # 'חסום' = לא נגיש ישירות בסביבה → גישה דרך WebSearch/site: בלבד.
  # ==========================================================================
  trend_sources:
  - name: Google Trends — Trending Now
    url: https://trends.google.com/trending
    type: trend
    what: מה שורף עכשיו בחיפושי גוגל לפי מדינה/קטגוריה. נגיש.
  - name: Product Hunt — Today
    url: https://www.producthunt.com/
    type: trend
    what: כלי/מוצרי AI חדשים שמשיקים היום — מקור לרעיונות אפליקציה. נגיש.
  - name: Hacker News — Front page
    url: https://news.ycombinator.com/
    type: trend
    what: שיח מפתחים/סטארטאפים לפני שמגיע לתקשורת. נגיש (לעיתים 403 → site:).
  - name: Reddit — r/singularity, r/OpenAI, r/Entrepreneur, r/SideProject
    url: https://www.reddit.com/r/singularity/
    type: trend
    what: כלים/דיונים שמתפוצצים בקהילות AI ובילדרים. חסום — site:reddit.com בלבד.
  - name: X — Explore / Trending
    url: https://x.com/explore/tabs/trending
    type: trend
    what: האשטגים/נושאים חמים ב-X. חסום/לוגין — site:x.com בלבד (או X MCP).
  - name: TikTok Creative Center — Trends
    url: https://ads.tiktok.com/business/creativecenter/trends/hub/pc/en
    type: trend
    what: האשטגים/סאונדים/סרטונים טרנדיים לרילז. חסום — WebSearch בלבד.
  - name: YouTube Charts
    url: https://charts.youtube.com/
    type: trend
    what: צ'ארטים יומיים (החליף את דף ה-Trending שהוסר ב-2025). חסום — WebSearch בלבד.
  - name: TechCrunch — AI
    url: https://techcrunch.com/category/artificial-intelligence/
    type: actuality
    what: 'חדשות AI שוטפות: השקות, גיוסים, כלים, מהלכי ענק. נגיש.'
  - name: VentureBeat — AI
    url: https://venturebeat.com/category/ai
    type: actuality
    what: כיסוי AI מכוון-עסקים — הזווית של "איך עושים מזה כסף". נגיש.
  - name: The Rundown AI
    url: https://www.therundown.ai/
    type: actuality
    what: ניוזלטר AI יומי (2M+) — חדשות + הכלי של היום.
  - name: TLDR AI
    url: https://tldr.tech/ai
    type: actuality
    what: ניוזלטר AI יומי (1M+) — דגש מחקר/מודלים חדשים.
  - name: Ben's Bites
    url: https://www.bensbites.com/
    type: actuality
    what: ניוזלטר AI לבילדרים/יזמים — תואם בול לקהל ncode.
  - name: Geektime — AI (עברית)
    url: https://www.geektime.co.il/tag/ai/
    type: actuality
    what: חדשות AI/הייטק ישראליות — הזווית המקומית.
  - name: כלכליסט-טק — AI (עברית)
    url: https://www.calcalist.co.il/tags/AI
    type: actuality
    what: כיסוי AI כלכלי-הייטק ישראלי — גיוסים, שוק עבודה, מגמות.

  # חשבונות X/טוויטר עם סיגנל גבוה — הסוכן מחפש מה חם אצלם
  x_accounts:
    - rowancheung
    - TheRundownAI
    - mattshumer_
