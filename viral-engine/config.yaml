# ---------- הגדרות מודל ----------
# עיקרון: מודל זול לעבודות איסוף/דירוג, מודל חזק רק איפה שהכתיבה עצמה קובעת.
model:
  default: "claude-sonnet-5"
  effort: "high"
  per_agent:
    scout: "claude-sonnet-5"          # איסוף וסינון — סונט מספיק
    scorer: "claude-sonnet-5"         # דירוג לפי רובריקה — סונט מספיק
    scriptwriter: "claude-opus-4-8"   # הלב של המערכת — שווה את ההפרש
    critic: "claude-opus-4-8"         # שיפוט עדין של הוק וריטנשן
    ads: "claude-opus-4-8"            # קופי ממומן = כסף אמיתי על הקו
    style_modeler: "claude-opus-4-8"  # רץ פעם אחת — איכות מעל הכל

# ---------- כמה סקריפטים לייצר בכל ריצה ----------
daily:
  candidate_stories: 10   # כמה סיפורים הסקאוט מביא
  top_stories: 3          # כמה עוברים לכתיבת תסריט
