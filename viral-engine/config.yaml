# ==============================================================
#  viral-engine — קונפיגורציה ראשית
#  ערוך את הקובץ הזה כדי להתאים את המערכת אליך.
# ==============================================================

creator:
  name: "בן לביא"
  handle: "@benlavi"            # TODO: עדכן להנדל האמיתי באינסטגרם
  niche: "AI, בינה מלאכותית, בניית אפליקציות בלי קוד (Vibe Coding), יזמות דיגיטלית"
  audience: >
    קהל ביזאופ (Biz-Opp) ישראלי בתוך בהלת הזהב של ה-AI: מרגישים שעכשיו, ממש בחודשים
    האלה, נפתח חלון חד-פעמי לעשות כסף עם AI לפני שכולם נכנסים — הכנסה נוספת, יציאה
    מהתקורה, עסק ראשון. שכירים בצווארון-לבן שרואים משרות בסיכון, הייטקיסטים ותיקים,
    תושבי פריפריה, יזמים בתחילת דרכם, עצמאים, צעירים שרוצים "להיכנס לעולם ה-AI לפני
    כולם". רובם לא טכניים. מה שמניע אותם: כסף, הצלחה, סטטוס, פחד לפספס את הרכבת —
    ועכשיו גם התחושה הכפולה שמניעה כל סרטון: "זו ההזדמנות שלי" (החלון נפתח עכשיו,
    לפני כולם) מול "אם לא עכשיו — אני אתייתר" (FOBO, פחד מהתייתרות).
  tone: >
    אנרגטי, ישיר, מדבר בגובה העיניים, בעברית מדוברת. סמכותי אבל לא מתנשא.
    משתמש במספרים קונקרטיים ובדוגמאות אמיתיות. כל תוכן נכתב בדחיפות של בהלת זהב —
    החלון נפתח *עכשיו*, לא "בעתיד" — וממוסגר תמיד קונקרטית דרך "ככה אתה מרוויח
    מזה", לא רק "זה מעניין טכנולוגית".

# ---------- הפאנלים / יעדי ההנעה לפעולה ----------
# כל CTA בסרטון חייב להוביל לאחד מהנכסים האלה.
funnels:
  - id: youtube
    name: "ערוץ היוטיוב"
    url: "https://youtube.com/@..."          # TODO
    what: "הדרכות עומק חינמיות על AI ובניית אפליקציות"
    best_for: "סיפורי חדשות שדורשים הסבר עמוק / המשך צפייה"

  - id: free_course
    name: "קורס חינמי"
    url: "https://..."                        # TODO
    what: "מיני-קורס חינמי לכניסה לעולם ה-AI"
    best_for: "קהל קר שמגלה אותי בפעם הראשונה"

  - id: base44_webinar
    name: "וובינר Base44 (אפיליאציה)"
    url: "https://..."                        # TODO
    what: "וובינר חי על בניית אפליקציות עם Base44"
    best_for: "סיפורים על אנשים שבנו אפליקציות/עסקים עם AI"

  - id: paid_course
    name: "הקורס המלא (ncode)"
    url: "https://..."                        # TODO
    what: "הקורס בתשלום — בניית מוצרים ועסקים עם AI מאפס"
    best_for: "רימרקטינג וקהל חם בלבד — לא CTA ראשי בסרטון ויראלי"

# ---------- מתנות חינמיות (Lead Magnets) לשער-תגובות ----------
# הסוכן בוחר מתנה מתאימה לכל סרטון, או מציע מתנה חדשה ליצירה.
lead_magnets:
  - id: prompts_pack
    name: "חבילת פרומפטים"
    what: "50 פרומפטים מוכנים לעבודה עם קלוד/GPT"
  - id: tools_list
    name: "רשימת כלי AI"
    what: "רשימת 30 כלי ה-AI ששווים את הזמן שלך, ממוינים לפי שימוש"
  - id: app_blueprint
    name: "מדריך בניית אפליקציה"
    what: "PDF: איך בונים אפליקציה ראשונה עם AI בלי שורת קוד, צעד-צעד"
  - id: news_digest
    name: "עדכון AI שבועי"
    what: "כניסה לקבוצת וואטסאפ/ניוזלטר עם עדכוני ה-AI החשובים"

# ---------- מילות טריגר לתגובות (ManyChat) ----------
# מילים קצרות בעברית שקל להקליד. הסוכן בוחר אחת פר סרטון.
comment_triggers: ["AI", "כלים", "מדריך", "אפליקציה", "פרומפטים", "בוט", "עדכונים"]

# ---------- מקורות חדשות ----------
news:
  topics:
    - "אנשים רגילים/לא-טכניים שבנו אפליקציה/SaaS עם AI ועושים מזה כסף *עכשיו* (הנושא מספר 1)"
    - "כלים/פיצ'רים חדשים שמורידים את מחסום בניית אפליקציות עם AI"
    - "מודלים חדשים של AI (OpenAI, Anthropic, Google, Meta)"
    - "כלי AI חדשים שמשנים את כללי המשחק"
    - "אנשים/ילדים/לא-טכניים שבנו משהו מטורף עם AI"
    - "סיפורי כסף: סטארטאפים, אקזיטים, משכורות בתחום ה-AI"
    - "AI מחליף עבודות / משנה תעשיות"
    - "דרמות בעולם הטק (פיטורים, תביעות, מלחמות ענק)"
    - "פיצ'רים ויראליים חדשים (וידאו, תמונות, סוכנים)"
    - "סיפורי הון-עתק בסגנון @wealth: עליות ונפילות של יזמים, אימפריות, החלטות של מיליארדים"

  # עמודי השראה לסיפורי evergreen — הסקאוט בודק מה עבד להם לאחרונה
  # (הפורמט של הסרטון של בן — 236K — הוא בדיוק סיפור בסגנון הזה)
  inspiration_pages:
    - handle: "@wealth"
      url: "https://www.instagram.com/wealth"
      what: >
        סיפורי כסף/הצלחה מטורפים עם ויז'ואלס חזקים. מקור סיפורים למסלול האוורגרין
        ורפרנס ויזואלי (תמונות ארכיון של הדמות, גרפיקת מספרים). כל סיפור משם חייב
        גשר לעולמות של בן: AI, SaaS, לעשות כסף מהאינטרנט.
  # חשבונות X/טוויטר עם סיגנל גבוה — הסוכן מחפש מה חם אצלם
  x_accounts:
    - rowancheung
    - TheRundownAI
    - mattshumer_
    - AndrewCurran_
    - kimmonismus
    - OpenAI
    - AnthropicAI
    - GoogleDeepMind
    - sama
    - testingcatalog
  israeli_sources:
    - "Geektime"
    - "כלכליסט טק"
    - "TheMarker טכנולוגיה"

# ---------- הגדרות מודל ----------
# עיקרון: מודל זול לעבודות איסוף/דירוג, מודל חזק רק איפה שהכתיבה עצמה קובעת.
model:
  default: "claude-sonnet-5"
  effort: "high"
  per_agent:
    scout: "claude-sonnet-5"          # איסוף וסינון — סונט מספיק
    scorer: "claude-sonnet-5"         # דירוג לפי רובריקה — סונט מספיק
    scriptwriter: "claude-opus-4-8"   # הלב של המערכת — שווה את ההפרש
    critic: "claude-opus-4-8"         # שיפוט עדין של הוק וריטנשן
    ads: "claude-opus-4-8"            # קופי ממומן = כסף אמיתי על הקו
    style_modeler: "claude-opus-4-8"  # רץ פעם אחת — איכות מעל הכל

# ---------- כמה סקריפטים לייצר בכל ריצה ----------
daily:
  candidate_stories: 10   # כמה סיפורים הסקאוט מביא
  top_stories: 3          # כמה עוברים לכתיבת תסריט
