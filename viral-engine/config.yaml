    - "כלים/פיצ'רים חדשים שמורידים את מחסום בניית אפליקציות עם AI"
    - "מודלים חדשים של AI (OpenAI, Anthropic, Google, Meta)"
    - "כלי AI חדשים שמשנים את כללי המשחק"
    - "אנשים/ילדים/לא-טכניים שבנו משהו מטורף עם AI"
    - "סיפורי כסף: סטארטאפים, אקזיטים, משכורות בתחום ה-AI"
    - "AI מחליף עבודות / משנה תעשיות"
    - "דרמות בעולם הטק (פיטורים, תביעות, מלחמות ענק)"
    - "פיצ'רים ויראליים חדשים (וידאו, תמונות, סוכנים)"
    - "סיפורי הון-עתק בסגנון @wealth: עליות ונפילות של יזמים, אימפריות, החלטות של מיליארדים"

