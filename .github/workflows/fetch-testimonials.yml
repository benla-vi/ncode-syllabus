          ls -la incoming

      - name: Publish to assets branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan assets-incoming
          git rm -rf --cached . >/dev/null
          find . -maxdepth 1 ! -name . ! -name .git ! -name incoming -exec rm -rf {} +
          git add incoming
          git commit -m "Testimonial screenshots fetched from Drive"
          git push -f origin assets-incoming
