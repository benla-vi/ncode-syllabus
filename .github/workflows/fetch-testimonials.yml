name: Fetch testimonial screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - claude/fetch-assets

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download public Drive screenshots
        run: |
          set -eu
          mkdir -p incoming
          while IFS='|' read -r name id; do
            [ -z "$name" ] && continue
            echo "-> $name"
            curl -sSL --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "incoming/${name}.png"
            file "incoming/${name}.png"
          done <<'LIST'
          b01_chen-mor-0710|1dH7IdrJfz4YglGQltPH9O-R2A76tLL2-
          b02_moshe-0709-5|1GhsXrm14kDXAnblBINqQZ7mfspJsVKeY
          b03_moshe-0709-4|1Qi4LjHz_pIQELZ-5QovQUI0wS13dYwDF
          b04_moshe-0709-3|1pl8zyNE7wRfbrzpI7Bcd7mSXzZZVLn91
          b05_moshe-0709-2|1d5Lw4or5HN6Hl12xEcZ6aNwwKJM83_ef
          b06_moshe-0709|1VgUg-TX_5ZNZ_4QOLUGxVsRd6gPoYRNO
          b07_maor-0709|1tUg6i6U5_916yoVWZ6J7LkxgdAClf5Ml
          b08_shimon-0706|179QtljVltYJL0bn5tff-mVq-wGTnwhJ-
          b09_niv-0703-2|1nbVSOTIgJ14wJ1DsVavLi7_e1ATICht_
          b10_omer-balak-0623|1-HZbwowhD7evBszPTK0eIwrgEK0_TsH7
          b11_moshe-0623|12EVAH2rNKRnQyYjYhQyY3ZpwI0kgBS5z
          b12_maor-0622|1oxXdi7du3SCnJ_vOr9xoLEUnsZzFfeu-
          b13_sarah-friedman-0622|1UeeMr-mL5D2G8kFCQ1JTlcBvl4vGSp40
          b14_shimon-0620-2|1JceEmSfx4-asP9Z5QAVmBXE1HK95IGPM
          b15_shimon-0620|10LSWbvo84ysb2FMrQUsISlYti0j3CPnO
          b16_shimon-0613|1J90K5Vj0Pw6lCTqjPeH28b0lZbdpMaBs
          b17_unidentified-0603|1FJf8NkS8v9rJ8yqTwiiCA0E0GqZ0yi6X
          b18_shimon-0518|1TUuKiDQ7Z6joLrQ0X49xzDSz_CKoy4u7
          b19_amit-malka-0618|10_f_xvT3j6j4bxOxeqzGgpsVwszBDnJy
          LIST
          ls -la incoming

      - name: Publish to assets branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan assets-incoming2
          git rm -rf --cached . >/dev/null
          find . -maxdepth 1 ! -name . ! -name .git ! -name incoming -exec rm -rf {} +
          git add incoming
          git commit -m "Testimonial screenshots batch 2 fetched from Drive"
          git push -f origin assets-incoming2
