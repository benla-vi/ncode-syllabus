name: Fetch testimonial screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - claude/fetch-assets

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download public Drive screenshots
        run: |
          set -eu
          mkdir -p incoming
          while IFS='|' read -r name id; do
            [ -z "$name" ] && continue
            echo "-> $name"
            curl -sSL --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "incoming/${name}.png"
            file "incoming/${name}.png"
          done <<'LIST'
          01_alon-nazarov-0725|1qmqmuXipDfp7D5QVWM22ASgdIKrDm3HA
